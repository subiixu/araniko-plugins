# Rebuilds index.json whenever main changes and commits it if anything changed.
# The app fetches index.json from this repo (one request, with an ETag).
name: Build index

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "categories.yaml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build index.json
        run: python3 -I scripts/build_index.py

      - name: Commit index.json
        run: |
          if git diff --quiet -- index.json && git ls-files --error-unmatch index.json >/dev/null 2>&1; then
            echo "index.json didn't change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Update index.json"
          git push
